name: BARRA CLOUD Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode & Prepare Keystore (Release Signing)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename & Package Artifacts
        run: |
          mkdir -p output_apks
          cp app/build/outputs/apk/debug/app-debug.apk output_apks/BARRA-CLOUD-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk output_apks/BARRA-CLOUD-release.apk || true
          if [ ! -f output_apks/BARRA-CLOUD-release.apk ]; prefix; then
            cp output_apks/BARRA-CLOUD-debug.apk output_apks/BARRA-CLOUD-release.apk || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BARRA-CLOUD-debug.apk
          path: output_apks/BARRA-CLOUD-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BARRA-CLOUD-release.apk
          path: output_apks/BARRA-CLOUD-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output_apks/BARRA-CLOUD-debug.apk
            output_apks/BARRA-CLOUD-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
